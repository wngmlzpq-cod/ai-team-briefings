<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{% block title %}J-OS{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <a class="brand" href="/">J-OS</a>
        <p class="brand-caption">JUHEE OPERATING SYSTEM</p>

        <nav class="side-nav">
            <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">통합 대시보드</a>
            <a href="/finance" class="{% if request.url.path.startswith('/finance') or request.url.path.startswith('/transactions') %}active{% endif %}">재무</a>
            <a href="/ai-team" class="{% if request.url.path.startswith('/ai-team') or request.url.path.startswith('/reports') %}active{% endif %}">AI 팀</a>
            <span class="disabled">일정 · 준비 중</span>
            <span class="disabled">학습 · 준비 중</span>
            <span class="disabled">커리어 · 준비 중</span>
        </nav>

        <form method="post" action="/logout" class="logout-form">
            <button type="submit">로그아웃</button>
        </form>
    </aside>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
