<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>로그인 · J-OS</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body class="login-page">
<form class="login-card" method="post" action="/login">
    <p class="eyebrow">JUHEE OPERATING SYSTEM</p>
    <h1>J-OS 로그인</h1>
    <p class="muted">개인 재무와 AI 팀 데이터 보호를 위해 로그인합니다.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <label>아이디<input name="username" autocomplete="username" required></label>
    <label>비밀번호<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="button" type="submit">로그인</button>
</form>
</body>
</html>
